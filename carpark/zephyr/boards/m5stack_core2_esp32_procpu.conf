# The terminal reads the clock and buzzes the vibration motor.
CONFIG_RTC=y
CONFIG_REGULATOR=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SERIAL=y
# GPS は今回の記事では使わない.
CONFIG_LED_STRIP_SHELL=y
CONFIG_I2C_SHELL=y

# サーボの位置合わせをシリアルからもできるようにする.
CONFIG_PWM_SHELL=y

# 配線の切り分け用. ピンのレベルをシリアルから読める.
CONFIG_GPIO_SHELL=y
# センサをシリアルから直接読めるようにする.
CONFIG_SENSOR_SHELL=y
