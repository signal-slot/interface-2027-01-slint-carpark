# 本体の振動モータ (AXP192 の LDO3).
CONFIG_REGULATOR=y
# サーボ (Port B).
CONFIG_PWM=y
# ToF (Port C).
CONFIG_I2C=y
CONFIG_SENSOR=y
# RGB LED (Port A). SPI で波形を作る.
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
# QR コード・リーダ (Port E).
CONFIG_SERIAL=y

# 配線の切り分け用. シリアルのシェルから各部品を直接動かせる.
CONFIG_LED_STRIP_SHELL=y
CONFIG_I2C_SHELL=y
# サーボの位置合わせ.
CONFIG_PWM_SHELL=y
# ピンのレベルを読む.
CONFIG_GPIO_SHELL=y
# センサを直接読む.
CONFIG_SENSOR_SHELL=y
